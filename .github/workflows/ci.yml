name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore EnterpriseWorkflow.slnx --locked-mode

      - name: Build
        run: dotnet build EnterpriseWorkflow.slnx --configuration Release --no-restore

      - name: Start OpenLDAP qualification service
        if: runner.os == 'Linux'
        run: |
          chmod +x tests/ldap/generate-test-certificate.sh
          ./tests/ldap/generate-test-certificate.sh
          docker compose -f tests/ldap/docker-compose.yml up -d --wait

      - name: Test
        run: dotnet test --solution EnterpriseWorkflow.slnx --configuration Release --no-build --no-restore
        env:
          LDAP_TEST_ENABLED: ${{ runner.os == 'Linux' && '1' || '0' }}
          LDAP_TEST_LDAPS: ${{ runner.os == 'Linux' && '1' || '0' }}
          LDAP_TEST_CA_FILE: ${{ github.workspace }}/tests/ldap/certs/server.crt
          LDAPTLS_CACERT: ${{ github.workspace }}/tests/ldap/certs/server.crt
          LDAPTLS_REQCERT: demand

      - name: Stop OpenLDAP qualification service
        if: always() && runner.os == 'Linux'
        run: docker compose -f tests/ldap/docker-compose.yml down --volumes

      - name: Run executable workflow sample
        run: dotnet run --project samples/ExecutableWorkflow/ExecutableWorkflow.csproj --configuration Release --no-build --no-restore
