name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore EnterpriseWorkflow.slnx --locked-mode

      - name: Build
        run: dotnet build EnterpriseWorkflow.slnx --configuration Release --no-restore

      - name: Start OpenLDAP qualification service
        if: runner.os == 'Linux'
        run: |
          chmod +x tests/ldap/generate-test-certificate.sh
          ./tests/ldap/generate-test-certificate.sh
          sudo cp tests/ldap/certs/ca.crt /usr/local/share/ca-certificates/enterprise-workflow-openldap.crt
          sudo update-ca-certificates
          docker compose -f tests/ldap/docker-compose.yml up -d --wait
          for attempt in {1..30}; do
            if timeout 2 openssl s_client \
              -connect 127.0.0.1:1636 \
              -verify_ip 127.0.0.1 \
              -CAfile tests/ldap/certs/ca.crt \
              -verify_return_error </dev/null >/tmp/openldap-tls-probe.log 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/openldap-tls-probe.log
              exit 1
            fi
            sleep 1
          done

      - name: Test
        run: dotnet test --solution EnterpriseWorkflow.slnx --configuration Release --no-build --no-restore
        env:
          LDAP_TEST_ENABLED: ${{ runner.os == 'Linux' && '1' || '0' }}
          LDAP_TEST_LDAPS: ${{ runner.os == 'Linux' && '1' || '0' }}
          LDAP_TEST_HOST: ${{ runner.os == 'Linux' && '127.0.0.1' || 'localhost' }}
          LDAP_TEST_CA_FILE: ${{ github.workspace }}/tests/ldap/certs/ca.crt
          LDAP_TEST_CA_DIRECTORY: ${{ github.workspace }}/tests/ldap/certs/trust
          LDAPTLS_CACERT: ${{ github.workspace }}/tests/ldap/certs/ca.crt
          LDAPTLS_REQCERT: demand

      - name: Dump OpenLDAP qualification logs after failure
        if: failure() && runner.os == 'Linux'
        run: docker compose -f tests/ldap/docker-compose.yml logs --no-color

      - name: Stop OpenLDAP qualification service
        if: always() && runner.os == 'Linux'
        run: docker compose -f tests/ldap/docker-compose.yml down --volumes

      - name: Run executable workflow sample
        run: dotnet run --project samples/ExecutableWorkflow/ExecutableWorkflow.csproj --configuration Release --no-build --no-restore
