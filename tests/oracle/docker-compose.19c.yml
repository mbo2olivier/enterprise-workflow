services:
  oracle:
    image: container-registry.oracle.com/database/enterprise:19.19.0.0
    platform: linux/arm64
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_PWD: ${ORACLE_TEST_PASSWORD:?Set ORACLE_TEST_PASSWORD}
      ORACLE_TEST_PASSWORD: ${ORACLE_TEST_PASSWORD:?Set ORACLE_TEST_PASSWORD}
    volumes:
      - ./official-setup:/opt/oracle/scripts/setup:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf 'whenever sqlerror exit 1\nselect 1 from dual;\nexit\n' |
          sqlplus -L -s EWTEST/"$${ORACLE_TEST_PASSWORD}"@//localhost:1521/ORCLPDB1
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s
