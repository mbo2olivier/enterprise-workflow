<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">Request approval process</title><desc id="desc">Submit a request, review it, then approve through the closing service or decline directly.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#075466"/></marker></defs>
<rect width="960" height="350" rx="16" fill="#f3fafb"/>
<path d="M200 150L275 150" stroke="#075466" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M455 130L535 65" stroke="#075466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="495.0" y="88.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#123744">approve</text>
<path d="M715 65L760 65" stroke="#075466" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M455 170L535 260" stroke="#075466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="495.0" y="206.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#123744">decline</text>
<rect x="20" y="110" width="180" height="80" rx="10" fill="white" stroke="#087e96" stroke-width="2"/><text x="110.0" y="147.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#123744">Submit</text><text x="110.0" y="172.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#315765">Alice + reason</text>
<rect x="275" y="110" width="180" height="80" rx="10" fill="white" stroke="#087e96" stroke-width="2"/><text x="365.0" y="147.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#123744">Review</text><text x="365.0" y="172.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#315765">Bob + comment</text>
<rect x="535" y="25" width="180" height="80" rx="10" fill="white" stroke="#087e96" stroke-width="2"/><text x="625.0" y="62.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#123744">Close service</text><text x="625.0" y="87.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#315765">IApprovalPolicy</text>
<rect x="760" y="25" width="180" height="80" rx="10" fill="white" stroke="#087e96" stroke-width="2"/><text x="850.0" y="62.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#123744">Completed</text><text x="850.0" y="87.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#315765">Accepted</text>
<rect x="535" y="220" width="180" height="80" rx="10" fill="white" stroke="#087e96" stroke-width="2"/><text x="625.0" y="257.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#123744">Rejected</text><text x="625.0" y="282.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#315765">Declined</text>
</svg>